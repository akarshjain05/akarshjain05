  <style>
    .pixel {
      opacity: 0;
      animation: construct 1.5s forwards, float 3s ease-in-out infinite alternate;
      transform-origin: center;
    }
    @keyframes construct {
      0% { transform: translateY(-50px) scale(0); opacity: 0; }
      60% { opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes float {
      0% { filter: drop-shadow(0px 0px 2px #39FF14); }
      100% { filter: drop-shadow(0px 0px 8px #39FF14); transform: translateY(-3px); }
    }
    .glitch-text {
      animation: glitch-anim 4s infinite;
      text-shadow: 0 0 5px #39FF14;
    }
    @keyframes glitch-anim {
      0%, 94% { opacity: 1; transform: skewX(0deg); }
      95% { opacity: 0.8; transform: skewX(-15deg); filter: url(#glitch); }
      96% { opacity: 1; transform: skewX(15deg); filter: none; }
      97% { opacity: 0.9; transform: skewX(0deg); filter: url(#glitch); }
      98% { opacity: 1; transform: skewX(0deg); filter: none; }
      100% { opacity: 1; }
    }
    .pixel:nth-child(1) { animation-delay: 0.0s, 1.5s; }
